name: Deploy Nexo Player

# Sobe o plugin pros sites WordPress via SFTP/FTP quando houver push na main.
# Cada site é um GitHub Environment (pornoreels, ...) com seus próprios
# secrets/vars. Sites sem configuração são PULADOS (não dão erro).
# Configure em: Settings → Environments.
#   Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Vars:    FTP_SERVER_DIR (terminando com /), FTP_PORT (opcional),
#            FTP_PROTOCOL (opcional: sftp | ftp | ftps — padrão sftp, porta 22)
#   FTP_SERVER deve ser o IP/host DE ORIGEM do servidor: dominio proxied pelo
#   Cloudflare nao passa FTP/SFTP e da timeout na conexao.
# Para adicionar um site novo: crie o Environment e acrescente o nome na matrix abaixo.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-nexo-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [pornoreels]
    environment: ${{ matrix.site }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica FTP (pula o site se não estiver configurado)
        id: check
        shell: bash
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::warning::Site '${{ matrix.site }}' não configurado (faltam secrets/vars de FTP) — pulando."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo "::error::FTP_SERVER_DIR precisa terminar com / (site: ${{ matrix.site }})"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}

      - name: Upload do plugin (lftp — sftp/ftp/ftps)
        if: steps.check.outputs.deploy == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          PROTO="${FTP_PROTOCOL:-sftp}"
          if [ -z "$FTP_PORT" ]; then
            if [ "$PROTO" = "sftp" ]; then FTP_PORT=22; else FTP_PORT=21; fi
          fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$PROTO://$FTP_SERVER" -e "
            set sftp:auto-confirm yes;
            set ssl:verify-certificate no;
            set net:timeout 20;
            set net:max-retries 2;
            mirror -R --verbose \
              -x '^\.git' -x '^\.github/' -x 'node_modules/' -x 'vendor/' \
              -x '\.md\$' -x '\.map\$' -x '\.DS_Store\$' -x '\.gitignore\$' \
              ./ '$FTP_SERVER_DIR';
            bye"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
